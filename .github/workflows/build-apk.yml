name: Build GBA Pocket APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GbaPocket-fixed-build-ready.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -q GbaPocket-fixed-build-ready.zip -d extracted
          test -f extracted/GbaPocket/settings.gradle.kts
          test -f extracted/GbaPocket/third_party/mgba-master/CMakeLists.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'



      - name: Install Android build tools
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk /opt/android-sdk -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
  

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Align Java and Kotlin JVM targets
        working-directory: extracted/GbaPocket
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.gbapocket"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.gbapocket"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 3
                  versionName = "1.2"

                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                      }
                  }

                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                  }
              }
          }
          EOF


  
      - name: Build debug APK
        working-directory: extracted/GbaPocket
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GbaPocket-debug-apk
          path: extracted/GbaPocket/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
