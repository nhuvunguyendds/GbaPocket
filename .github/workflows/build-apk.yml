name: Build GBA Pocket APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GbaPocket-fixed-build-ready.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -q GbaPocket-fixed-build-ready.zip -d extracted
          test -f extracted/GbaPocket/settings.gradle.kts
          test -f extracted/GbaPocket/third_party/mgba-master/CMakeLists.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted/GbaPocket
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GbaPocket-debug-apk
          path: extracted/GbaPocket/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
